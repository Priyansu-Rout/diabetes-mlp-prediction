[project]
name = "diabetes-mlp-prediction"
version = "0.1.0"
description = "Dibetic desise prediction"
readme = "README.md"
authors = [
    { name = "Priyansu-Rout", email = "priyansurout369@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "marimo>=0.24.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "streamlit>=1.64.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
assignment = "assignment:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false